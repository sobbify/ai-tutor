[project]
name = "ai-tutor-backend"
version = "1.0.0"
description = "AI Tutor speaking-practice backend: journey API, Gemini evaluation, reports and admin console API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "google-genai>=2.3",  # 3.x needs Python 3.11+
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-tutor = "ai_tutor.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_tutor = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "T20", "BLE"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/ai_tutor/cli.py" = ["T201"]  # a CLI talks on stdout
"src/ai_tutor/services/audio_check.py" = ["T201"]  # CLI self-test output
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"  # checker target; runtime supports 3.10+
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true
